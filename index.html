<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Noto Serif"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
            },
            colors: {
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                300: '#d6d3d1',
                400: '#a8a29e',
                500: '#78716c',
                600: '#57534e',
                700: '#44403c',
                800: '#292524',
                900: '#1c1917',
              },
              paper: '#fdfbf7',
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #fffbeb; }
      
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .scrollbar-visible::-webkit-scrollbar {
        width: 8px;
        display: block !important;
      }
      .scrollbar-visible::-webkit-scrollbar-track {
        background: transparent;
      }
      .scrollbar-visible::-webkit-scrollbar-thumb {
        background: #e7e5e4;
        border-radius: 4px;
      }
      .scrollbar-visible::-webkit-scrollbar-thumb:hover {
        background: #d6d3d1;
      }

      input::-webkit-outer-spin-button,
      input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type=number] {
        -moz-appearance: textfield;
      }

      /* Đảm bảo khoảng cách dòng luôn đều nhau trong editor */
      .rich-content {
        min-height: 400px;
        line-height: 1.6 !important;
        outline: none;
        text-align: left;
        word-wrap: break-word;
        overflow-wrap: break-word;
        word-break: break-word;
        white-space: pre-wrap;
        max-width: 100%;
      }
      
      /* Cưỡng ép tất cả các phần tử con bên trong editor sử dụng chung khoảng cách dòng */
      .rich-content * {
        line-height: 1.6 !important;
      }

      .rich-content ul { list-style-type: disc; padding-left: 2rem; margin: 1rem 0; }
      .rich-content ol { list-style-type: decimal; padding-left: 2rem; margin: 1rem 0; }
      .rich-content li { margin-bottom: 0.25rem; }
      
      .rich-content table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
      .rich-content table td, .rich-content table th { border: 1px solid #d6d3d1; padding: 8px; min-width: 50px; }
      
      .processed-link {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        color: #007bff;
        white-space: nowrap;
      }
      .link-arrow {
        font-weight: bold;
        text-decoration: none !important;
        cursor: pointer !important;
        display: inline-block;
        transition: transform 0.2s;
        padding: 0 4px;
        color: #007bff;
        font-size: 1.1em;
      }
      .link-arrow:hover {
        transform: scale(1.4);
        color: #0056b3;
      }
      .url-text {
        text-decoration: none;
        cursor: text;
        pointer-events: none;
        color: inherit;
      }

      .flip-h { transform: scaleX(-1); display: inline-block; }
      .flip-v { transform: scaleY(-1); display: inline-block; }

      @keyframes heartbeat {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      .animate-heartbeat {
        animation: heartbeat 2s ease-in-out infinite;
      }

      [title] { position: relative; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "crypto-js": "https://esm.sh/crypto-js@^4.2.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",
    "jspdf": "https://esm.sh/jspdf@^4.1.0",
    "lunar-javascript": "https://esm.sh/lunar-javascript@^1.7.7",
    "@dnd-kit/core": "https://esm.sh/@dnd-kit/core@^6.3.1",
    "@dnd-kit/sortable": "https://esm.sh/@dnd-kit/sortable@^10.0.0",
    "@dnd-kit/utilities": "https://esm.sh/@dnd-kit/utilities@^3.2.2"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
